<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Margin Teacher App</title>
<meta name="description" content="Margin helps private-university teachers manage their teaching and grow, every trimester. Teach better. Grow faster.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2EC;--surface:#FFFFFF;--surface-2:#F8F7F2;--sunk:#ECEBE3;--line:#E4E2D8;--line-2:#CFCDC0;
  --ink:#141C19;--ink-2:#46514C;--ink-3:#66716B;
  --primary:#1B2A25;--on-primary:#F6F4EC;
  --accent:#F2C94C;--accent-ink:#2A2205;--hl:#F7E39A;--hl-soft:#FBF4D8;
  --ok:#2F6E49;--ok-soft:#DFEFE4;--warn:#AE4E1C;--warn-soft:#F8E4D8;--cool:#2B6382;--cool-soft:#E0ECF3;
  --h1:#E7E6DE;--h2:#D8DCCF;--h3:#F3DE95;--h4:#EDBB4A;--h5:#D9783F;
  --focus:#2B6382;--shadow:0 1px 2px rgba(20,28,25,.04),0 8px 28px -12px rgba(20,28,25,.16);
  --serif:'Fraunces','Noto Serif Bengali',Georgia,'Times New Roman',serif;--sans:'Inter','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412;--surface:#151D1A;--surface-2:#1A2420;--sunk:#111816;--line:#25302C;--line-2:#34423C;
  --ink:#ECEAE2;--ink-2:#BCC4BE;--ink-3:#8E9993;--primary:#ECEAE2;--on-primary:#121A17;
  --accent:#F0CF5E;--accent-ink:#1E1A06;--hl:#5A4C17;--hl-soft:#25231A;
  --ok:#8FD1A6;--ok-soft:#18301F;--warn:#F2A07C;--warn-soft:#3A241B;--cool:#8EC2E0;--cool-soft:#162D3A;
  --h1:#1D2723;--h2:#28362F;--h3:#6B5B1E;--h4:#B08C26;--h5:#C2683A;--focus:#8EC2E0;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412;--surface:#151D1A;--surface-2:#1A2420;--sunk:#111816;--line:#25302C;--line-2:#34423C;
  --ink:#ECEAE2;--ink-2:#BCC4BE;--ink-3:#8E9993;--primary:#ECEAE2;--on-primary:#121A17;
  --accent:#F0CF5E;--accent-ink:#1E1A06;--hl:#5A4C17;--hl-soft:#25231A;
  --ok:#8FD1A6;--ok-soft:#18301F;--warn:#F2A07C;--warn-soft:#3A241B;--cool:#8EC2E0;--cool-soft:#162D3A;
  --h1:#1D2723;--h2:#28362F;--h3:#6B5B1E;--h4:#B08C26;--h5:#C2683A;--focus:#8EC2E0;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
mark{background:linear-gradient(transparent 52%,var(--hl) 52%,var(--hl) 92%,transparent 92%);color:inherit;padding:0 2px;border-radius:2px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:22px 16px 18px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px;font:500 25px/1 var(--serif);letter-spacing:-.02em}
.mark{width:28px;height:28px;flex:none}
.cap{display:flex;align-items:center;gap:10px;width:100%;height:46px;padding:0 12px 0 14px;border-radius:14px;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:14.5px;transition:transform .15s,box-shadow .2s;margin-bottom:14px}
.cap:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.cap kbd{margin-left:auto;font:600 11px var(--sans);opacity:.7;border:1px solid currentColor;border-radius:6px;padding:2px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;color:var(--ink-2);font-weight:500;font-size:15px;transition:background .15s,color .15s;text-align:left}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav .n{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-3)}
.nav button[aria-current="page"] .n{color:var(--ink-2)}
.term{margin-top:auto;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;transition:border-color .2s}
.term:hover{border-color:var(--line-2)}
.term-t{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3)}
.term-t b{color:var(--ink);font-weight:600}
.spark{display:flex;gap:3px;align-items:flex-end;height:30px;margin-top:10px}
.spark i{flex:1;border-radius:3px;background:var(--h1);transition:height .4s}
.spark i.cur{outline:2px solid var(--ink);outline-offset:1px}
.me{display:flex;align-items:center;gap:10px;padding:12px 6px 0}
.me-n{font-weight:600;font-size:14px;line-height:1.2}
.me-s{font-size:12.5px;color:var(--ink-3)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none;transition:background .15s}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.main{min-width:0}
.view{max-width:1160px;margin:0 auto;padding:44px clamp(20px,4vw,56px) 96px}
.mtop,.tabs{display:none}

/* ---------- entrance ---------- */
.enter .rise{opacity:0;transform:translateY(10px);animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}}

/* ---------- type ---------- */
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;color:var(--ink-3)}
.dot-sep{width:3px;height:3px;border-radius:50%;background:var(--line-2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.heavy{background:var(--warn-soft);color:var(--warn)}
.pill.private{background:var(--cool-soft);color:var(--cool)}
.display{font:500 clamp(32px,4.4vw,48px)/1.06 var(--serif);letter-spacing:-.025em;margin-top:12px;font-variation-settings:"opsz" 144}
.lede{font-size:18px;line-height:1.6;color:var(--ink-2);max-width:62ch;margin-top:14px}
.lede b{color:var(--ink);font-weight:600}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:34px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.card-h h2{font:500 21px/1.2 var(--serif);letter-spacing:-.01em}
.card-sub{font-size:13.5px;color:var(--ink-3);margin-bottom:8px}
.badge{font:600 12px/1 var(--sans);background:var(--sunk);color:var(--ink-2);border-radius:99px;padding:5px 9px}
.grid-today{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid var(--line-2);background:var(--surface);transition:background .15s,transform .1s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.primary:hover{opacity:.92}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.accent:hover{filter:brightness(1.04)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{color:var(--ink-2);font-weight:600;font-size:14px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.link:hover{color:var(--ink);text-decoration-color:var(--ink-3)}

/* ---------- rows ---------- */
.list{list-style:none;margin:0;padding:0}
.grp{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 2px}
.grp:first-child{margin-top:10px}
.row{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line);transition:opacity .3s,transform .3s}
.list .row:first-child{border-top:0}
.row.leaving{opacity:0;transform:translateX(14px)}
.tick{width:44px;height:44px;margin:-10px -8px -10px -11px;display:grid;place-items:center;flex:none;border-radius:50%}
.tick>span{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--line-2);display:grid;place-items:center;color:var(--ok);transition:all .2s}
.tick svg{opacity:0;transition:opacity .2s}
.tick:hover>span{border-color:var(--ok);background:var(--ok-soft)}
.tick:hover svg{opacity:.7}
.row.leaving .tick>span,.tick.on>span{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.row.leaving .tick svg,.tick.on svg{opacity:1}
.row-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--ink-2);margin-top:-2px}
.row-ic.ai{background:var(--cool-soft);color:var(--cool)}
.row-main{flex:1;min-width:0}
.row-t{font-weight:500;line-height:1.4}
.row.done .row-t{text-decoration:line-through;color:var(--ink-3)}
.row-s{font-size:13.5px;color:var(--ink-3);margin-top:2px}
.row-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.who{color:var(--ink-2);font-weight:500;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;border-radius:4px}
.who:hover{color:var(--ink);text-decoration-color:var(--ink-3)}
.quote{margin:8px 0 0;padding:2px 0 2px 12px;border-left:2px solid var(--cool);font-size:14px;color:var(--ink-2);font-style:italic}
.due{font-size:12.5px;font-weight:600;white-space:nowrap;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--ink-2);flex:none}
.due.late{background:var(--warn-soft);color:var(--warn)}
.due.today{background:var(--hl);color:var(--ink)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--ink-2)}
.tag.letter{background:var(--cool-soft);color:var(--cool)}
.foot{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.empty{text-align:center;padding:28px 10px 18px;color:var(--ink-3)}
.empty-ic{width:52px;height:52px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.empty b{display:block;color:var(--ink);font:500 19px var(--serif);margin-bottom:4px}

/* ---------- avatar ---------- */
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none;letter-spacing:.02em}
.av.lg{width:56px;height:56px;font-size:19px}
.avs{display:flex;margin-top:10px}
.avs button{margin-right:-6px;border-radius:50%;box-shadow:0 0 0 2.5px var(--surface);transition:transform .15s}
.avs button:hover{transform:translateY(-2px);z-index:1}

/* ---------- timeline ---------- */
.tl{position:relative;margin-top:8px}
.ev{display:grid;grid-template-columns:58px minmax(0,1fr);gap:14px;position:relative}
.ev-time{font-size:13px;color:var(--ink-3);text-align:right;padding-top:12px}
.ev-body{border-left:2px solid var(--line);padding:10px 0 14px 18px;position:relative}
.ev-body::before{content:"";position:absolute;left:-6px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.ev-t{font-weight:600}
.ev-s{font-size:13.5px;color:var(--ink-3)}
.ev.past .ev-t,.ev.past .ev-s,.ev.past .ev-time{opacity:.5}
.ev.past .ev-body::before{background:var(--line-2)}
.ev.live .ev-body::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--hl-soft)}
.ev.research .ev-body{border-left-color:var(--accent)}
.ev.research .ev-in{background:var(--hl-soft);border-radius:14px;padding:12px 14px 14px;margin-top:-2px}
.ev.research .ev-body::before{border-color:var(--accent)}
.prot{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent);padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:2px}
.nowline{display:grid;grid-template-columns:58px minmax(0,1fr);gap:14px;align-items:center;margin:-4px 0}
.nowline span{font-size:12px;font-weight:700;color:var(--warn);text-align:right}
.nowline i{height:2px;background:var(--warn);position:relative;margin-left:-6px;border-radius:2px}
.nowline i::before{content:"";position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--warn)}

/* ---------- tiles ---------- */
.tile{display:flex;gap:20px;align-items:center;text-align:left;width:100%;cursor:pointer;transition:transform .2s,box-shadow .25s,border-color .2s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2)}
.tile-k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tile-t{font:500 20px/1.25 var(--serif);margin:4px 0 4px;letter-spacing:-.01em}
.tile-s{font-size:13.5px;color:var(--ink-3)}
.tile .go{margin-left:auto;color:var(--ink-3);flex:none;transition:transform .2s}
.tile:hover .go{transform:translateX(3px);color:var(--ink)}
.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{display:block}
.ring b{position:absolute;font:600 17px var(--serif)}
.ring.lg b{font-size:34px;letter-spacing:-.02em}
.ring.lg small{position:absolute;margin-top:46px;font:500 12px var(--sans);color:var(--ink-3)}
.bars{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter.ok i{background:var(--ok)}
.meter.acc i{background:var(--accent)}
.mrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-3);margin-bottom:5px}
.mrow b{color:var(--ink-2);font-weight:600}

/* ---------- teaching ---------- */
.strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;align-items:end;height:100px;margin-top:18px}
.wk{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:100%;gap:6px;border-radius:10px;padding:0 0 2px}
.wk i{display:block;border-radius:7px;transition:height .5s cubic-bezier(.2,.8,.2,1),transform .15s}
.wk:hover i{transform:scaleY(1.04)}
.wk span{font-size:11.5px;color:var(--ink-3);text-align:center;font-weight:600}
.wk[aria-pressed="true"] span{color:var(--ink)}
.wk[aria-pressed="true"] i{outline:2px solid var(--ink);outline-offset:2px}
.wk.cur span::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--warn);margin:3px auto 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.wkd{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.wkd h3{font:500 18px var(--serif)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:5px 11px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px}
.course{display:flex;flex-direction:column;gap:16px;text-align:left;cursor:pointer;transition:transform .2s,box-shadow .25s,border-color .2s}
.course:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line-2)}
.course-code{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-3)}
.course-t{font:500 22px/1.2 var(--serif);letter-spacing:-.01em;margin-top:2px}
.needs{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--accent-ink);background:var(--hl);border-radius:10px;padding:8px 12px}
.needs.ok{background:var(--ok-soft);color:var(--ok)}
:root[data-theme="dark"] .needs,:root:not([data-theme="light"]) .needs{color:var(--ink)}
.cf{list-style:none;margin:8px 0 0;padding:0}
.cf li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.cf li:first-child{border-top:0}
.st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.auto,.st.pending{background:var(--cool-soft);color:var(--cool)}
.st.needs{background:var(--hl);color:var(--accent-ink)}
.st.locked{background:var(--sunk);color:var(--ink-3)}
.cf textarea,.field textarea,.field input,.field select{width:100%;border:1px solid var(--line-2);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14.5px;resize:vertical}
.cf textarea{margin-top:8px;min-height:72px}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stamp{display:flex;gap:12px;align-items:center;background:var(--ok-soft);color:var(--ok);border-radius:16px;padding:14px 16px;font-weight:600;margin-top:16px}

/* ---------- people ---------- */
.seg{display:inline-flex;padding:4px;border-radius:14px;background:var(--sunk);gap:2px}
.seg button{height:38px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink-2);transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button .n{font-weight:500;color:var(--ink-3);margin-left:4px}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);max-width:420px;width:100%}
.search input{border:0;background:transparent;outline:0;flex:1;font-size:15px;color:var(--ink);min-width:0}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px var(--cool-soft)}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.person{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:18px;cursor:pointer;transition:transform .2s,box-shadow .25s,border-color .2s;border-radius:20px}
.person:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2)}
.person-n{font-weight:600}
.person-l{font-size:13.5px;color:var(--ink-2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);font-size:13.5px;font-weight:600;color:var(--ink-2);background:var(--surface)}
.fbtn[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:transparent}

/* ---------- compass ---------- */
.hero-c{display:grid;grid-template-columns:auto minmax(0,1fr);gap:36px;align-items:center}
.hero-c h2{font:500 28px/1.15 var(--serif);letter-spacing:-.02em}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}
.fact b{display:block;font:500 26px/1.1 var(--serif);letter-spacing:-.02em}
.fact span{font-size:13px;color:var(--ink-3)}
.nudge{display:flex;gap:16px;align-items:flex-start;background:var(--cool-soft);border-radius:20px;padding:18px 20px;margin-top:20px}
.nudge p{flex:1;color:var(--ink);font-size:15px}
.nudge .row-acts{margin-top:12px}
.pager{font-size:12.5px;color:var(--cool);font-weight:600;white-space:nowrap}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.paper{border-top:1px solid var(--line);padding:14px 0}
.paper:first-child,.card-h+.paper,.meter+.blk,.card-h+.goal{border-top:0}
.paper-btn{display:block;width:100%;text-align:left;border-radius:10px}
.paper-t{font-weight:600;line-height:1.35}
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0 6px}
.track i{height:6px;border-radius:99px;background:var(--sunk);transition:background .4s}
.track i.on{background:var(--primary)}
.track i.acc{background:var(--ok)}
.paper-m{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-3)}
.paper-x{margin-top:10px;font-size:14px;color:var(--ink-2)}
.blk{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.blk:first-of-type{border-top:0}
.goal{padding:12px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal-t{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin-bottom:8px;font-size:14.5px}
.goal-w{font-size:13px;color:var(--ink-3);margin-top:6px;font-style:italic}
.tpl{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.tpl button{text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line-2);transition:border-color .15s,background .15s}
.tpl button:hover,.tpl button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.tpl b{display:block;font-weight:600}
.tpl span{font-size:13.5px;color:var(--ink-3)}

/* ---------- dept ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.kpi b{display:block;font:500 40px/1 var(--serif);letter-spacing:-.03em;margin:10px 0 6px}
.dtable{width:100%;border-collapse:collapse;font-size:14.5px}
.dtable th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px 10px 0;border-bottom:1px solid var(--line)}
.dtable td{padding:14px 12px 14px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.dtable tr:last-child td{border-bottom:0}
.mini{display:flex;align-items:center;gap:10px;min-width:120px}
.mini .meter{flex:1}
.status{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.warn{background:var(--hl);color:var(--ink)}
.status.bad{background:var(--warn-soft);color:var(--warn)}
.privacy{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:18px;background:var(--cool-soft);color:var(--ink);font-size:14.5px}
.privacy svg{color:var(--cool);flex:none;margin-top:2px}

/* ---------- layers ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(9,13,11,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;justify-content:flex-end;animation:fade .2s ease}
.scrim.center{justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
@keyframes fade{from{opacity:0}}
.sheet{width:min(540px,100%);height:100%;overflow:auto;background:var(--surface);padding:28px 28px 40px;box-shadow:var(--shadow);animation:slideIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.sheet h2{font:500 28px/1.15 var(--serif);letter-spacing:-.02em}
.sheet h3{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 6px}
.modal{width:min(640px,100%);max-height:calc(100vh - 12vh - 16px);overflow:auto;background:var(--surface);border-radius:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);overflow:hidden;animation:pop .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.pal-in{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);color:var(--ink-3)}
.pal-in input{flex:1;border:0;outline:0;background:transparent;font-size:18px;color:var(--ink);min-width:0}
.pal-pre{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:13px}
.pal-pre .chip{background:var(--surface)}
.pal-pre .chip b{font-weight:600;color:var(--ink)}
.pal-list{list-style:none;margin:0;padding:8px;max-height:46vh;overflow:auto}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;text-align:left;font-size:15px;min-height:46px}
.opt[aria-selected="true"]{background:var(--sunk)}
.opt .k{margin-left:auto;font-size:12px;color:var(--ink-3)}
.opt-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);flex:none}
.pal-foot{display:flex;gap:16px;padding:10px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.pal-foot kbd{font:600 11px var(--sans);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;margin-right:4px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stats3 div{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px}
.stats3 b{display:block;font:500 24px var(--serif)}
.stats3 span{font-size:12.5px;color:var(--ink-3)}
.note{padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.note:first-child{border-top:0}
.note small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}

/* onboarding */
.ob{padding:34px 34px 28px}
.ob-dots{display:flex;gap:6px;margin-bottom:22px}
.ob-dots i{height:6px;width:6px;border-radius:99px;background:var(--line-2);transition:width .3s}
.ob-dots i.on{width:24px;background:var(--ink)}
.ob h2{font:500 32px/1.12 var(--serif);letter-spacing:-.025em;margin-top:8px}
.ob-list{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:2px}
.ob-list li{display:flex;gap:14px;align-items:center;padding:10px 0;opacity:0;transform:translateY(6px);animation:rise .45s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(200ms + var(--i)*140ms)}
.ob-list .st{animation:popin .35s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(320ms + var(--i)*140ms)}
@keyframes popin{from{transform:scale(0)}}
.ob-act{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px}

/* focus */
.focus{position:fixed;inset:0;z-index:90;background:#0C1210;color:#ECEAE2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:fade .4s}
.focus .k{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#9AA59E;font-weight:600}
.focus h2{font:500 clamp(26px,4vw,38px)/1.2 var(--serif);margin-top:14px;max-width:24ch}
.focus .timer{font:400 clamp(72px,16vw,148px)/1 var(--serif);letter-spacing:-.04em;margin:28px 0 8px;font-variant-numeric:tabular-nums}
.focus .held{color:#9AA59E;font-size:15px}
.focus .acts{display:flex;gap:10px;margin-top:36px;flex-wrap:wrap;justify-content:center}
.focus .btn{background:transparent;color:#ECEAE2;border-color:#34423C}
.focus .btn:hover{background:#1A2420}
.focus .btn.accent{background:#F0CF5E;color:#1E1A06;border-color:transparent}
.breathe{width:220px;height:220px;border-radius:50%;position:absolute;z-index:-1;background:radial-gradient(circle,rgba(240,207,94,.10),transparent 70%);animation:breathe 8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.25)}}

/* toasts */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--primary);color:var(--on-primary);border-radius:14px;padding:8px 8px 8px 16px;font-size:14.5px;font-weight:500;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.toast button{min-height:34px;padding:0 12px;border-radius:9px;font-weight:700;color:var(--accent)}
:root[data-theme="dark"] .toast button{color:#7a5d00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast button{color:#7a5d00}}
.toast button:hover{background:rgba(127,127,127,.18)}
.toast.only{padding:12px 18px}

/* prototype menu */
.proto{position:fixed;right:18px;bottom:18px;z-index:55}
.proto-b{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:99px;background:var(--surface);border:1px dashed var(--line-2);font-size:13px;font-weight:600;color:var(--ink-2);box-shadow:var(--shadow)}
.proto-m{position:absolute;right:0;bottom:48px;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;animation:pop .2s}
.proto-m h4{margin:10px 0 6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.proto-m h4:first-child{margin-top:0}
.proto-m .seg{display:flex}
.proto-m .seg button{flex:1;padding:0 8px;height:34px;font-size:13px}
.proto-m .btn{width:100%;justify-content:flex-start;margin-top:6px}
.phone-wrap{position:fixed;inset:0;z-index:95;background:rgba(9,13,11,.7);display:grid;place-items:center;animation:fade .2s;padding:16px}
.phone{width:390px;height:min(844px,calc(100vh - 80px));border-radius:48px;border:12px solid #0b0f0d;background:#0b0f0d;box-shadow:0 40px 100px -20px rgba(0,0,0,.6);overflow:hidden;position:relative}
.phone iframe{width:100%;height:100%;border:0;border-radius:36px;background:var(--bg)}
.phone-x{position:absolute;top:18px;right:18px}
.phone-x .btn{background:#0b0f0d;color:#fff;border-color:#333}

/* ---------- v4: ripple toasts ---------- */
.toast-m{display:flex;flex-direction:column;gap:4px;padding:2px 0}
.trail{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:500;opacity:.78}
.trail span{display:flex;align-items:center;gap:6px}
.trail svg{flex:none;opacity:.8}
.via{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--cool);margin-left:6px}

/* impact strip */
.impact{margin-top:20px}
.impact-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:12px}
.impact-g>div{padding:6px 18px;border-left:1px solid var(--line)}
.impact-g>div:first-child{border-left:0;padding-left:0}
.impact-g b{display:block;font:500 34px/1.1 var(--serif);letter-spacing:-.02em}
.impact-g span{font-size:13px;color:var(--ink-3)}
.impact-g em{display:block;font-style:normal;font-size:12px;color:var(--ok);font-weight:600;margin-top:4px}

/* privacy lens */
.lens{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.lens>div{border-radius:18px;padding:16px;border:1px solid var(--line)}
.lens .me-side{background:var(--surface-2)}
.lens .uni-side{background:var(--cool-soft);border-color:transparent}
.lens h4{margin:0 0 10px;font-size:13px;display:flex;align-items:center;gap:6px}
.lens ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:14px}
.lens li small{display:block;color:var(--ink-3);font-size:12.5px}
.redact{display:inline-block;height:10px;border-radius:4px;background:var(--line-2);vertical-align:middle}

/* admin */
.score{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,220px) 84px;align-items:center;gap:18px;padding:14px 0;border-top:1px solid var(--line)}
.card-h+.score{border-top:0}
.score-l{font-weight:500}
.score-l small{display:block;color:var(--ink-3);font-size:12.5px;font-weight:400}
.tm{position:relative;height:10px;border-radius:99px;background:var(--sunk)}
.tm i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ok);transition:width .6s}
.tm i.below{background:var(--accent)}
.tm .tgt{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px}
.score-v{text-align:right;font:500 22px var(--serif)}
.score-v small{display:block;font:500 11.5px var(--sans);color:var(--ink-3)}
.setup li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.setup li:first-child{border-top:0}
.nstep{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:12px;padding:3px}
.nstep button{width:34px;height:34px;border-radius:9px;font-size:18px;font-weight:600}
.nstep button:hover{background:var(--sunk)}
.nstep b{min-width:30px;text-align:center;font:500 20px var(--serif)}
.rule{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0}
.switch{width:44px;height:26px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.crunch{display:flex;gap:16px;align-items:flex-start;margin-top:20px;background:var(--warn-soft);border-color:transparent}
.crunch .row-ic{background:var(--surface);color:var(--warn)}
.loadrow{display:grid;grid-template-columns:170px minmax(0,1fr) 30px;gap:14px;align-items:center;padding:8px 0;font-size:14px}

/* cover */
.cover{position:fixed;inset:0;z-index:130;background:var(--bg);overflow:auto;animation:fade .3s}
.cover-in{max-width:1140px;margin:0 auto;padding:clamp(28px,6vh,72px) clamp(20px,5vw,64px) 48px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(28px,5vw,64px);align-items:center;min-height:100%}
.cover h1 span{color:var(--ink-3)}
.cover h1{font:500 clamp(34px,4.1vw,54px)/1.05 var(--serif);letter-spacing:-.035em;margin-top:18px}
.cover .lede{font-size:19px}
.facts4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.facts4 div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.facts4 b{display:block;font:500 30px/1 var(--serif);letter-spacing:-.02em;margin-bottom:6px}
.facts4 span{font-size:13.5px;color:var(--ink-2)}
.facts4 a{display:block;font-size:11.5px;color:var(--ink-3);margin-top:6px}
.roles{display:flex;flex-direction:column;gap:10px}
.role{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;opacity:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(200ms + var(--i)*110ms);transform:translateY(8px)}
.role .row-ic{width:36px;height:36px;border-radius:12px}
.role b{display:block}
.role span{font-size:14px;color:var(--ink-2)}
.role small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.cover-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.cover-acts .btn{min-height:50px;padding:0 22px;font-size:15px;border-radius:14px}

/* tour */
.tourblock{position:fixed;inset:0;z-index:118;transition:background .4s}
.tourblock.dim{background:rgba(9,13,11,.55)}
.spot{position:fixed;z-index:119;border-radius:24px;box-shadow:0 0 0 3px var(--accent),0 0 0 9999px rgba(9,13,11,.55);pointer-events:none;transition:all .5s cubic-bezier(.2,.8,.2,1)}
.tour{position:fixed;z-index:121;right:24px;bottom:24px;width:min(420px,calc(100% - 32px));background:var(--surface);color:var(--ink);border-radius:24px;padding:22px 22px 18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,.8,.2,1)}
.tour .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.tour h3{font:500 23px/1.2 var(--serif);letter-spacing:-.015em;margin:6px 0 8px}
.tour p{font-size:14.5px;color:var(--ink-2)}
.tour-f{display:flex;align-items:center;gap:8px;margin-top:18px}
.tour-dots{display:flex;gap:5px;margin-right:auto}
.tour-dots i{width:6px;height:6px;border-radius:99px;background:var(--line-2);transition:width .3s}
.tour-dots i.on{width:20px;background:var(--ink)}
.tour .try{margin-top:14px;width:100%}
.tour.final{left:50%;right:auto;bottom:50%;transform:translate(-50%,50%);width:min(760px,calc(100% - 32px));padding:32px;animation:none}
.biz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.biz div{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px}
.biz small{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.biz b{display:block;font:500 19px/1.25 var(--serif);margin:6px 0 4px}
.biz span{font-size:13px;color:var(--ink-2)}
.lang{font:700 12px var(--sans);width:auto;padding:0 10px}
#toasts{z-index:125}
body.touring #toasts{top:20px;bottom:auto}
body.touring .proto{display:none}


/* =====================================================================
   v5 design system: framed workspace, pastel bento, one geometric face
   ===================================================================== */
:root{
  --serif:'Manrope','Noto Sans Bengali',system-ui,sans-serif;--sans:'Manrope','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;
  --page:#DCE4FB;--frame:#FFFFFF;--surface:#F5F5F7;--surface-2:#FFFFFF;--sunk:#EBEBF0;--line:#E6E6EC;--line-2:#D3D3DB;
  --ink:#0F0F12;--ink-2:#4A4A55;--ink-3:#6B6B77;--primary:#111114;--on-primary:#FFFFFF;
  --accent:#F2C14E;--accent-ink:#111114;--hl:#FBE5A0;--hl-soft:#FDF4D9;
  --p-yellow:#F2C14E;--p-blue:#B3C6FB;--p-blue-2:#9CB3F8;--p-pink:#EBA6F6;--p-orange:#F7983A;--on-pastel:#111114;
  --ok:#22744A;--ok-soft:#DDF1E5;--warn:#C2410C;--warn-soft:#FDE6D7;--cool:#3150C8;--cool-soft:#E4EAFD;
  --h1:#ECECF1;--h2:#D9E2FC;--h3:#FBE5A0;--h4:#F2C14E;--h5:#F7983A;
  --shadow:0 1px 2px rgba(15,15,18,.04),0 12px 32px -14px rgba(15,15,18,.18);
  --frame-shadow:0 40px 90px -40px rgba(15,15,30,.28),0 2px 6px rgba(15,15,18,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0A0B0F;--frame:#121318;--surface:#1A1B21;--surface-2:#22232A;--sunk:#24252D;--line:#2A2B33;--line-2:#3A3B45;
  --ink:#F3F3F6;--ink-2:#BDBEC8;--ink-3:#8D8E9A;--primary:#F3F3F6;--on-primary:#111114;
  --accent:#EDBD4C;--accent-ink:#111114;--hl:#5A4A17;--hl-soft:#2A2618;
  --p-yellow:#E9B949;--p-blue:#A2B6F2;--p-blue-2:#8CA5EE;--p-pink:#DD9CEA;--p-orange:#EE8F35;
  --ok:#86D6A6;--ok-soft:#163023;--warn:#F5A27A;--warn-soft:#3A2219;--cool:#9DB2F5;--cool-soft:#1C2340;
  --h1:#24252D;--h2:#28304A;--h3:#5A4A17;--h4:#B98F2C;--h5:#C46A26;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.7);--frame-shadow:0 40px 90px -40px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0A0B0F;--frame:#121318;--surface:#1A1B21;--surface-2:#22232A;--sunk:#24252D;--line:#2A2B33;--line-2:#3A3B45;
  --ink:#F3F3F6;--ink-2:#BDBEC8;--ink-3:#8D8E9A;--primary:#F3F3F6;--on-primary:#111114;
  --accent:#EDBD4C;--accent-ink:#111114;--hl:#5A4A17;--hl-soft:#2A2618;
  --p-yellow:#E9B949;--p-blue:#A2B6F2;--p-blue-2:#8CA5EE;--p-pink:#DD9CEA;--p-orange:#EE8F35;
  --ok:#86D6A6;--ok-soft:#163023;--warn:#F5A27A;--warn-soft:#3A2219;--cool:#9DB2F5;--cool-soft:#1C2340;
  --h1:#24252D;--h2:#28304A;--h3:#5A4A17;--h4:#B98F2C;--h5:#C46A26;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.7);--frame-shadow:0 40px 90px -40px rgba(0,0,0,.8);color-scheme:dark}

body{background:var(--page);font-family:var(--sans);letter-spacing:-.005em}
.display,.card-h h2,.tile-t,.course-t,.fact b,.kpi b,.ring b,.score-v,.stats3 b,.impact-g b,.sheet h2,.ob h2,.tour h3,.cover h1,.hero-c h2,.wkd h3,.empty b,.biz b,.focus h2,.focus .timer,.role b,.facts4 b,.tour.final h3,.nstep b,.brand{font-weight:800;letter-spacing:-.03em}
.display{font-size:clamp(30px,3.6vw,42px)}
.card-h h2{font-size:19px;letter-spacing:-.02em}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%)}
.card{border-radius:26px;border-color:transparent;background:var(--surface)}
.sheet,.modal,.tour,.proto-m,.cover{background:var(--frame)}
.sheet .card,.modal .card{background:var(--surface)}
.btn{border-radius:99px}
.btn.sm{border-radius:99px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.badge{border-radius:99px}

/* ---------- framed workspace ---------- */
.app{display:block;max-width:1480px;margin:clamp(0px,2.2vw,28px) auto;background:var(--frame);border-radius:clamp(0px,2.6vw,38px);box-shadow:var(--frame-shadow);min-height:calc(100vh - 56px);overflow:clip}
.side,.mtop{display:none!important}
.topbar{display:flex;align-items:center;gap:16px;padding:16px clamp(16px,2.4vw,32px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--frame) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.topbar .brand{padding:0;font-size:22px;gap:10px;flex:1}
.topbar .brand .mark{width:34px;height:34px}
.pillnav{display:flex;gap:6px;justify-content:center}
.pillnav button{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:99px;background:var(--surface);font-weight:600;font-size:14.5px;color:var(--ink-2);transition:background .2s,color .2s,transform .15s}
.pillnav button:hover{color:var(--ink);background:var(--sunk)}
.pillnav button[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
.pillnav button[aria-current="page"] svg{color:var(--p-blue)}
.pillnav .n{font-size:11.5px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:grid;place-items:center;background:var(--frame);color:var(--ink-2)}
.pillnav button[aria-current="page"] .n{background:rgba(255,255,255,.16);color:inherit}
.topr{display:flex;gap:8px;align-items:center;flex:1;justify-content:flex-end}
.rbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--frame);color:var(--ink);position:relative;transition:background .2s,transform .15s;font:700 12.5px var(--sans)}
.rbtn:hover{background:var(--surface)}
.rbtn .bdg{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--p-orange);color:var(--on-pastel);font-size:10.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--frame)}
.me-av{width:46px;height:46px;border-radius:50%;padding:0;border:2px solid var(--p-blue);overflow:hidden}
.me-av .av{width:100%;height:100%;font-size:14px}
.rolechip{font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:99px;background:var(--surface);color:var(--ink-2)}
.view{max-width:none;padding:28px clamp(16px,2.4vw,32px) 48px}

/* ---------- dashboard ---------- */
.dhead{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.hello{display:flex;align-items:center;gap:12px;font:800 clamp(26px,2.6vw,34px)/1.1 var(--sans);letter-spacing:-.035em;margin:0}
.hello .sunb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--hl);color:var(--on-pastel);flex:none}
.lede-s{font-size:15px;color:var(--ink-2);margin-top:6px}
.lede-s b{color:var(--ink)}
.dhead-r{display:flex;gap:10px;align-items:center}
.range{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 10px 0 18px;border-radius:99px;border:1px solid var(--line);background:var(--frame);font-weight:600;font-size:14.5px;color:var(--ink)}
.range:hover{background:var(--surface)}
.range .pill{margin-left:4px}
.bento{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.bcol{display:flex;flex-direction:column;gap:20px;min-width:0}
.b{background:var(--surface);border-radius:28px;padding:20px;position:relative;min-width:0}
.b-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.b-h h2{font:800 18px/1.2 var(--sans);letter-spacing:-.025em;margin:0}
.b-sub{font-size:13px;color:var(--ink-3);font-weight:500}
.ic-c{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--frame);color:var(--ink);flex:none;border:1px solid var(--line)}

/* stat tiles */
.tiles4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st4{position:relative;border-radius:26px;padding:16px 18px 16px;min-height:118px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:var(--on-pastel);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;outline-offset:3px}
.st4:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.st4 .ic-c{background:rgba(255,255,255,.45);border-color:transparent;color:inherit;width:36px;height:36px}
.st4 .lbl{font-size:14px;font-weight:600}
.st4 .num{position:absolute;right:18px;bottom:12px;font:800 38px/1 var(--sans);letter-spacing:-.04em}
.st4.t-owed{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.st4.t-owed .ic-c{background:var(--frame);border:1px solid var(--line)}
.st4.t-week{background:var(--p-yellow)}
.st4.t-needs{background:var(--p-blue)}
.st4.t-late{background:var(--p-pink)}
.st4[aria-pressed="true"]{box-shadow:0 0 0 3px var(--frame),0 0 0 5px var(--primary)}
.st4 .sel{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}

/* week strip */
.wkhead{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
.wkhead h2{font:800 17px var(--sans);letter-spacing:-.02em;margin:0}
.arrows{display:flex;gap:6px}
.arrows button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--frame)}
.arrows button:hover{background:var(--surface)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;background:none;border:0}
.day .dn{font-size:12.5px;color:var(--ink-3);font-weight:600}
.day .dd{width:min(52px,100%);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line-2);font-weight:700;font-size:15px;position:relative;transition:background .2s,color .2s,border-color .2s}
.day:hover .dd{border-color:var(--ink-3)}
.day.today .dn{color:var(--ink);font-weight:800}
.day[aria-pressed="true"] .dd{background:var(--primary);color:var(--on-primary);border:1.5px solid var(--primary)}
.day .dots{position:absolute;bottom:6px;display:flex;gap:2px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--p-orange)}
.day[aria-pressed="true"] .dots i{background:var(--p-yellow)}
.day.off .dd{opacity:.45}

/* up next */
.upnext{display:grid;grid-template-columns:168px minmax(0,1fr);gap:16px;padding:12px;align-items:stretch}
.un-art{border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;color:var(--on-pastel);min-height:168px;position:relative;overflow:hidden}
.un-art .ic-c{background:rgba(255,255,255,.55);border-color:transparent;color:var(--on-pastel)}
.un-art b{font:800 34px/1 var(--sans);letter-spacing:-.04em}
.un-art small{display:block;font-size:12.5px;font-weight:700;opacity:.8;margin-bottom:4px}
.un-art>div{position:relative;z-index:1}
.un-art svg.deco{position:absolute;right:-14px;bottom:-14px;opacity:.35}
.un-body{display:flex;flex-direction:column;gap:8px;min-width:0;padding:4px 4px 2px 0}
.un-t{font:800 18px/1.2 var(--sans);letter-spacing:-.02em}
.un-s{font-size:13.5px;color:var(--ink-2)}
.un-k{font-size:12.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--p-blue-2);transition:width .6s}
.un-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;flex-wrap:wrap}
.avs3{display:flex}
.avs3>*{margin-right:-8px;border-radius:50%;box-shadow:0 0 0 2.5px var(--surface)}
.avs3 .more{width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:11.5px;font-weight:800;display:grid;place-items:center}
.lnk{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--frame);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.lnk:hover{color:var(--ink);background:var(--surface)}
.corner{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--p-blue);color:var(--on-pastel)}
.later{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding:0 4px}
.later span{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--frame);border:1px solid var(--line);color:var(--ink-2)}

/* owed list (dark hero + light cards) */
.ow{display:flex;flex-direction:column;gap:0}
.oc{border-radius:24px;padding:14px 14px 12px;background:var(--frame);border:1px solid var(--line);transition:opacity .3s,transform .3s}
.oc+.oc{margin-top:-10px;border-top-left-radius:0;border-top-right-radius:0;padding-top:22px}
.oc.hero{background:#111114;color:#F3F3F6;border-color:#111114;position:relative;z-index:2}
:root[data-theme="dark"] .oc.hero{background:#000;border-color:#000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .oc.hero{background:#000;border-color:#000}}
.oc.leaving{opacity:0;transform:translateX(14px)}
.oc-r1{display:flex;align-items:center;gap:12px}
.oc-tk{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line-2);color:var(--ok);flex:none;transition:all .2s}
.oc-tk svg{opacity:.35}
.oc-tk:hover{background:var(--ok-soft);border-color:var(--ok)}
.oc-tk:hover svg{opacity:1}
.oc.hero .oc-tk{background:#26272E;border-color:#3A3B45;color:#86D6A6}
.oc-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--p-blue);color:var(--on-pastel);flex:none}
.oc-t{font-weight:700;font-size:15px;line-height:1.3;flex:1;min-width:0}
.oc-tags{display:flex;gap:6px;flex:none}
.tg{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.oc.hero .tg{background:#26272E;color:#E4E4EA}
.tg.late{background:var(--p-orange);color:var(--on-pastel)}
.tg.today{background:var(--p-yellow);color:var(--on-pastel)}
.tg.msg{background:var(--p-blue);color:var(--on-pastel)}
.tg.ok{background:#BDEBCB;color:#0F3D24}
.oc-r2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-left:52px;flex-wrap:wrap}
.oc-src{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface);color:var(--ink-2)}
.oc.hero .oc-src{background:#26272E;color:#C9C9D2}
.oc-who{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;border-radius:99px;padding:2px 2px 2px 8px}
.oc-who:hover{background:var(--surface)}
.oc.hero .oc-who:hover{background:#26272E}
.oc-who .av{width:30px;height:30px;font-size:11px}
.oc-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-left:52px}
.oc-acts .btn{min-height:36px}
.oc.hero .btn{background:#26272E;color:#F3F3F6;border-color:#3A3B45}
.oc.hero .btn.ghost{background:transparent;border-color:transparent;color:#C9C9D2}
.ow-more{margin-top:12px;align-self:flex-start}

/* impact pill */
.impill{display:flex;align-items:center;gap:14px;padding:14px 18px 14px 14px;border-radius:99px;background:var(--frame);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;width:100%}
.impill .big-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--p-blue);color:var(--on-pastel);flex:none}
.impill .t{font-weight:800;font-size:15.5px;letter-spacing:-.02em;white-space:nowrap}
.impill .s{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.stack{display:flex;margin-left:auto}
.stack span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin-left:-8px;box-shadow:0 0 0 3px var(--frame);color:var(--on-pastel)}
.impill .v{text-align:right;margin-left:12px}
.impill .v{white-space:nowrap}
.impill .v b{display:block;font:800 26px/1 var(--sans);letter-spacing:-.04em}
.impill .v small{font-size:12px;color:var(--ink-3)}

/* donut */
.dn-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dn-big{font:800 34px/1.05 var(--sans);letter-spacing:-.04em;display:flex;align-items:center;gap:10px;margin-top:2px}
.dn-big .tg{background:var(--primary);color:var(--on-primary)}
.dn-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.dn-leg{display:flex;flex-direction:column;gap:10px}
.dn-leg button{display:flex;align-items:center;gap:10px;text-align:left;font-size:14px;font-weight:600;border-radius:99px;padding:2px}
.dn-leg button:hover{background:var(--frame)}
.dn-leg .pc{min-width:58px;height:30px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:800}
.dn-leg .pc i{width:6px;height:6px;border-radius:50%;background:currentColor}
.dn-leg small{display:block;font-size:12px;color:var(--ink-3);font-weight:500}

/* research black card */
.rs{background:#111114;color:#F3F3F6;border-radius:28px;padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;position:relative}
:root[data-theme="dark"] .rs{background:#000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rs{background:#000}}
.rs .art{width:92px;height:92px;border-radius:22px;display:grid;place-items:center;color:var(--p-yellow)}
.rs .sticker{position:absolute;top:-16px;left:-10px;width:56px;height:56px;display:grid;place-items:center;transform:rotate(-14deg);font:800 13px var(--sans);color:#fff}
.rs .sticker svg{position:absolute;inset:0}
.rs .sticker span{position:relative}
.rs h3{font:800 17px/1.2 var(--sans);letter-spacing:-.02em;margin:0}
.rs .sub{font-size:12.5px;color:#B5B5C0;margin-top:3px}
.rs .rwho{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#D6D6DE;margin-top:8px}
.rs .rwho .av{width:24px;height:24px;font-size:9.5px}
.rs-stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rs-stats div{background:#1F2026;border-radius:16px;padding:10px 12px;text-align:center}
.rs-stats small{display:block;font-size:11.5px;color:#A9A9B5;font-weight:600}
.rs-stats b{font:800 20px/1.2 var(--sans);letter-spacing:-.02em}
.rs-act{grid-column:1/-1;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rs .prot{background:var(--p-yellow);color:var(--on-pastel)}
.rs .btn.accent{background:var(--p-yellow);color:var(--on-pastel)}

/* course chips + cards */
.segs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.segs button{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:99px;background:var(--surface);font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap;flex:none}
.segs button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.segs .dotc{width:8px;height:8px;border-radius:50%}
.cc2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc{border-radius:26px;padding:16px;min-height:200px;display:flex;flex-direction:column;color:var(--on-pastel);text-align:left;position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.cc:hover{transform:translateY(-2px)}
.cc.pink{background:var(--p-pink)}
.cc.orange{background:var(--p-orange)}
.cc .top{display:flex;justify-content:space-between;align-items:flex-start}
.cc .ic-b{width:46px;height:46px;border-radius:50%;background:#111114;color:#F3F3F6;display:grid;place-items:center}
.cc .frac{width:46px;height:46px;position:relative;display:grid;place-items:center;font-size:12px;font-weight:800}
.cc .frac svg{position:absolute;inset:0}
.cc .line{position:absolute;right:-10px;top:58px;width:92px;height:92px;opacity:.42}
.cc .by{margin-top:auto;padding-top:56px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;position:relative}
.cc b.t{display:block;font:800 16px/1.2 var(--sans);letter-spacing:-.02em;margin-top:6px;position:relative}
.cc small{font-size:12px;font-weight:600;opacity:.8;position:relative;display:flex;align-items:center;gap:5px;margin-top:2px}

/* assistant */
.ai-h{display:flex;align-items:center;justify-content:space-between;gap:4px 10px;margin-bottom:14px;flex-wrap:wrap}
.ai-h h2{display:flex;align-items:center;gap:10px;font:800 19px var(--sans);letter-spacing:-.02em;margin:0}
.ai-panel{border-radius:26px;background:radial-gradient(120% 90% at 50% 20%,#C9D6FD 0%,var(--p-blue) 45%,var(--p-blue-2) 100%);padding:16px;min-height:300px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;color:var(--on-pastel)}
.ai-panel::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.65) 1px,transparent 1.4px);background-size:22px 22px;opacity:.35;mask-image:radial-gradient(60% 50% at 50% 35%,#000,transparent)}
.ai-top{width:100%;display:flex;justify-content:space-between;align-items:center;position:relative}
.ai-top .avs3>*{box-shadow:0 0 0 2.5px var(--p-blue)}

const WEEKS=14;

function weekSum(n){return S.events.filter(e=>e.week===n).reduce((a,e)=>a+e.w,0)}
function level(n){const s=weekSum(n);return s<=1?1:s<=3?2:s<=5?3:s<=7?4:5}

const digest=()=>S.inbox.filter(m=>m.kind==='digest'&&!m.done);
const sugs=()=>S.suggestions.filter(s=>!s.done);
const left=a=>Math.max(0,a.total-a.graded);
const gradeMins=()=>S.assignments.reduce((t,a)=>t+left(a)*a.mins,0);
const hrs=m=>{const h=m/60;return h<1?Math.round(m)+' min':(Math.round(h*2)/2)+' h'};
const C=()=>S.compass;
function ptsOf(p){return p.stage>=4?(p.idx?1:.5):0}
function points(){return C().rule.base+C().papers.reduce((a,p)=>a+ptsOf(p),0)}
function idxCount(){return C().rule.baseIdx+C().papers.filter(p=>p.stage>=4&&p.idx).length}
function hoursDone(){return C().blocks.filter(b=>b.done).reduce((a,b)=>a+b.h,0)}
function hoursPlanned(){return C().blocks.reduce((a,b)=>a+b.h,0)}
function promoPct(){const r=C().rule;return Math.min(1,Math.min(points()/r.need,1)*.7+Math.min(idxCount()/r.needIdx,1)*.3)}
function paceMonths(){return Math.ceil(Math.max(0,C().rule.need-points())*5)}
function readyDate(m){if(m==null)m=paceMonths();if(!m)return null;const d=new Date();d.setMonth(d.getMonth()+m);return d.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}
function goalPct(g){if(g.kind==='promotion')return promoPct();if(g.kind==='papers')return Math.min(1,C().papers.filter(p=>p.stage>=4&&p.idx).length/(g.target||2));if(g.kind==='hours')return Math.min(1,hoursDone()/(g.target||4));const ms=g.ms||[];return ms.length?ms.filter(m=>m.done).length/ms.length:0}
function goalSub(g){const r=C().rule;if(g.kind==='promotion')return `${fmt(points())} of ${r.need} points, ${idxCount()} of ${r.needIdx} indexed`;if(g.kind==='papers')return `${C().papers.filter(p=>p.stage>=4&&p.idx).length} of ${g.target||2} accepted or published`;if(g.kind==='hours')return `${fmt(hoursDone())} of ${g.target||4} hours this week`;const ms=g.ms||[];return `${ms.filter(m=>m.done).length} of ${ms.length} milestones`}

function impact(){
  const auto=S.courseFiles.reduce((a,c)=>a+cfItems(c).filter((i,k)=>i.st==='done'&&c.items[k].st!=='needs').length,0);
  const held=S.inbox.filter(m=>m.kind==='digest').length;
  const mins=auto*12+held*1.5+S.stats.accepted*4+S.stats.timeSaved;
  return {kept:S.stats.kept,saved:mins/60,research:hoursDone(),held,auto};
}
function cfItems(c){const a=S.assignments.find(x=>x.id===c.aid);const L=a?left(a):0;return c.items.map(it=>it.st==='pending'?(L>0?it:Object.assign({},it,{st:'done',s:'Uploaded to Margin: 6 of 6'})):it.st!=='auto'?it:Object.assign({},it,L>0?{st:'auto',s:`Fills in when grading is done, ${L} scripts left`}:{st:'done',s:it.t==='Marks distribution'?'Generated from your final marks':'Calculated from marks against each CLO'}))}
function cfReady(c){return cfItems(c).filter(i=>i.st!=='locked')}
function cfPct(c){if(c.submitted)return 1;const its=cfReady(c);return its.filter(i=>i.st==='done').length/its.length}
function cfNeeds(c){return c.submitted?0:c.items.filter(i=>i.st==='needs').length}

function agenda(off){

  }

  const mode=S.mode||'calm';

    <div class="dhead-r"><div class="modeseg" role="group" aria-label="Dashboard density"><button type="button" data-act="mode" data-v="calm" aria-pressed="${mode==='calm'}">${ic('sunr',15)} Calm</button><button type="button" data-act="mode" data-v="full" aria-pressed="${mode==='full'}">${ic('teaching',15)} Full</button></div>
    ${mode==='full'?`<button type="button" class="range" data-act="rm" data-v="term">${ic('cal',18)} ${rng} <span class="pill ${lvl>=4?'heavy':''}">${bn?'সপ্তাহ '+bnN(cw):'Week '+cw} · ${L(LV[lvl])}</span></button>`:''}<button type="button" class="rbtn" data-act="lens" aria-label="${L('What does my university see?')}">${ic('lock',18)}</button></div></header>`;
  if(mode==='full'&&!PHONE())return `<div class="view dash">${header}
  <div class="bento">
    <div class="bcol">
      <div class="tiles4 rise" style="--i:1" role="group" aria-label="Filter what you owe">${tiles.map(([k,l,n,icn])=>`<button type="button" class="st4 t-${k}" data-act="tf" data-v="${k}" aria-pressed="${f===k}"><span class="ic-c">${ic(icn,17)}</span><span class="lbl">${L(l)}</span><span class="num">${bnN(n)}</span></button>`).join('')}</div>
      <section class="rise" style="--i:2" aria-labelledby="wk-h"><div class="wkhead"><h2 id="wk-h">${t0().toLocaleDateString(bn?'bn-BD':'en-GB',{month:'long',year:'numeric'})}</h2><div class="arrows"><button type="button" data-act="dayshift" data-d="-1" aria-label="Previous day">${ic('chevL',16,2.2)}</button><button type="button" data-act="dayshift" data-d="1" aria-label="Next day">${ic('chev',16,2.2)}</button></div></div><div class="days">${days}</div></section>
      <div>${upHTML}${laterHTML}</div>
      ${owHTML}
    </div>
    <div class="bcol">${impHTML}${dnHTML}${rsHTML}${coHTML}</div>
    <div class="bcol right">${feedHTML(4)}${rmHTML}</div>
  </div></div>`;

  /* ---------- calm view ---------- */
  const ns=nextStep();
  const skipId=ns.kind==='p'?ns.p.id:ns.kind==='m'?ns.m.id:null;
  const cf2=S.tf==='owed'||!S.tf?'owed':S.tf;
  const list=owedItems(cf2).filter(it=>it.x.id!==skipId);
  const chips=[['owed','All today',owedItems('owed').filter(it=>it.x.id!==skipId).length],['week','Later this week',owedItems('week').length],['needs','Messages',needs().filter(m=>m.id!==skipId).length],['late','Late',owedItems('late').filter(it=>it.x.id!==skipId).length]];
  const calmList=`<section class="b calm-list rise" style="--i:2" aria-labelledby="cl-h"><div class="b-h"><h2 id="cl-h">${skipId?'Then':'Your list'}</h2><span class="b-sub">${list.length?list.length+' to go':'Nothing waiting'}</span></div>
    <div class="softchips" role="group" aria-label="Show">${chips.map(([k,l,n])=>`<button type="button" data-act="tf" data-v="${k}" aria-pressed="${cf2===k}">${l}${n?` <span class="num">${n}</span>`:''}</button>`).join('')}</div>
    ${list.length?`<div class="ow calm">${list.slice(0,S.owAll?20:3).map((it,i)=>ocCard(it,i+1)).join('')}</div>${list.length>3&&!S.owAll?`<button type="button" class="lnk ow-more" data-act="ow-all">Show ${list.length-3} more</button>`:''}`
      :`<p class="calm-empty">${cf2==='late'?'Nothing is late.':cf2==='needs'?'No messages need you.':cf2==='week'?'Nothing else due this week.':'That was the only thing for today.'}</p>`}</section>`;
  // compact up next
  let upC='';
  if(up){const [col,icn]=KIND[up.k]||KIND.teach;const isLive=sel===0&&nm>=up.s&&nm<up.e;const ppl=(up.people||[]).map(id=>student(id)).filter(Boolean);
    upC=`<section class="b upc rise" style="--i:3" aria-label="Up next"><span class="upc-ic" style="background:${col}">${ic(icn,18)}</span><div class="upc-m"><div class="upc-k">${isLive?'Now':'Up next'} · <span class="num">${esc(up.time||'')}</span></div><div class="upc-t">${esc(up.t)}</div><div class="upc-s">${esc(up.sub)}</div>${ppl.length?`<div class="avs3" style="margin-top:8px">${ppl.slice(0,4).map(x=>`<button type="button" data-act="student" data-id="${x.id}" aria-label="Open ${esc(x.name)}">${av(x.name)}</button>`).join('')}</div>`:''}</div><button type="button" class="lnk" data-act="dayview">${ic('cal',14)} Whole day</button></section>`}
  // compact assistant
  const aiC=cur?`<section class="b aic rise" style="--i:4" data-tour="ai" aria-labelledby="aic-h"><div class="b-h"><h2 id="aic-h">${ic('spark',18)} ${L('Margin noticed')}</h2><span class="b-sub">${si+1} of ${sg.length}</span></div>
      <div class="aic-card"><div class="t">${esc(cur.task)}</div><div class="q">“${esc(cur.q)}”</div><div class="m">${esc(cur.src)} · due ${dueLow(cur.due)}</div>
      <div class="aic-acts"><button type="button" class="btn sm primary" data-act="sg-add" data-id="${cur.id}">${ic('plus',15,2.4)} ${L('Add promise')}</button><button type="button" class="btn sm" data-act="sg-edit" data-id="${cur.id}">${L('Edit first')}</button><button type="button" class="btn sm ghost" data-act="sg-no" data-id="${cur.id}">${L('Not a promise')}</button>${sg.length>1?`<button type="button" class="btn sm ghost" data-act="sgp" data-d="1" aria-label="Next suggestion" style="margin-left:auto">${ic('chev',16,2.2)}</button>`:''}</div></div>
      <form class="ask" data-ask style="margin-top:12px"><label class="sr" for="askq">Promise something or jump anywhere</label><input id="askq" autocomplete="off" placeholder="Promise something, or jump anywhere…"><button type="submit" aria-label="Open capture">${ic('send',18,2.2)}</button></form></section>`
    :`<section class="b aic rise" style="--i:4" data-tour="ai"><div class="b-h"><h2>${ic('spark',18)} ${L('Margin noticed')}</h2></div><p class="calm-empty" style="margin:0">Nothing new in your email. Margin will tell you when a message holds a promise.</p><form class="ask" data-ask style="margin-top:12px"><label class="sr" for="askq">Promise something or jump anywhere</label><input id="askq" autocomplete="off" placeholder="Promise something, or jump anywhere…"><button type="submit" aria-label="Open capture">${ic('send',18,2.2)}</button></form></section>`;
  // at a glance
  const gx=S.gx||{};const cfNeed=S.courseFiles.reduce((a,c)=>a+cfNeeds(c),0);

    ['grading','Grading',gm?`About ${hrs(gm)} left`:'All done',`${Math.round(gDone/gTot*100)}% graded${gl[0]?' · next back '+dueLow(gl.slice().sort((a,b)=>a.ret<b.ret?-1:1)[0].ret):''}`,'flag','var(--p-orange)',dnHTML],

    ['courses','Course files',cfNeed?`${cfNeed} item${cfNeed>1?'s':''} need you`:'Nothing needs you',S.courseFiles.map(c=>`${c.course} ${Math.round(cfPct(c)*100)}%`).join(' · '),'letter','var(--p-pink)',coHTML],
    ['week','This week',`${fmt(im.saved)} h saved`,`${im.kept} promises kept · ${im.held} messages held`,'cal','var(--p-blue)',impHTML+rmHTML]];
  const glanceHTML=`<section class="rise" style="--i:5" aria-labelledby="gl-h"><div class="b-h" style="margin:6px 4px 10px"><h2 id="gl-h">At a glance</h2><span class="b-sub">Open what you need</span></div>
    <div class="glance">${glance.map(([k,t,v,sub,icn,col,body])=>`<div class="gl ${gx[k]?'open':''}"><button type="button" class="gl-row" data-act="glance" data-v="${k}" aria-expanded="${!!gx[k]}"><span class="gl-ic" style="background:${col}">${ic(icn,17)}</span><span class="gl-m"><span class="gl-t">${t}</span><span class="gl-s">${esc(sub)}</span></span><span class="gl-v">${esc(v)}</span><span class="gl-ch">${ic('chev',16,2.2)}</span></button>${gx[k]?`<div class="gl-body">${body}</div>`:''}</div>`).join('')}</div></section>`;

  if(PHONE())return mobileToday({ns,list,aiC:feedHTML(3),glanceHTML:compassLine(),sel,todayDow});
  return `<div class="view dash calm">${header}
  <div class="calm-grid">
    <div class="bcol">${nextStepHTML(ns)}${feedHTML()}</div>
    <div class="bcol">${upC}${calmList}${compassLine()}<form class="ask" data-ask><label class="sr" for="askq">Ask Margin</label><input id="askq" autocomplete="off" placeholder="Ask Margin: make a question paper, plan my week…"><button type="submit" aria-label="Ask Margin">${ic('send',18,2.2)}</button></form></div>

}


/* ---------- v7 phone Today ---------- */
function rng2(a,b){const ap=m=>m>=720?'pm':'am';return ap(a)===ap(b)?`${fmtMinShort(a).replace(':00','')}–${fmtMinShort(b).replace(':00','')} ${ap(b)}`:`${fmtMin(a)} – ${fmtMin(b)}`}
const RINGS='<div class="rings" aria-hidden="true"><i class="r1"></i><i class="r2"></i><i class="r3"></i><i class="r4"></i><i class="r5"></i><i class="r6"></i></div>';
function mobileToday({ns,list,aiC,glanceHTML,sel,todayDow}){
  // hero
  let hT='',hS='',hActs='',hPpl=[];
  if(ns.kind==='p'){const p=ns.p;hT=p.task;hS=ns.why;if(p.sid)hPpl=[p.sid];hActs=`<button type="button" class="mh-main" data-act="done-p" data-id="${p.id}">${ic('check',16,2.6)} Done</button><button type="button" class="mh-sec" data-act="snz" data-id="${p.id}">Tomorrow</button>`}
  else if(ns.kind==='research'){hT='Research writing';hS=ns.why;hActs=`<button type="button" class="mh-main" data-act="focus">${ic('focus',16)} Start focus</button><button type="button" class="mh-sec" data-act="book-block">Later</button>`}
  else if(ns.kind==='m'){const m=ns.m;hT=m.subj;hS=ns.why;if(m.sid)hPpl=[m.sid];hActs=m.act==='promise'?`<button type="button" class="mh-main" data-act="msg-done" data-id="${m.id}">${ic('check',16,2.6)} Done</button>`:`<button type="button" class="mh-main" data-act="msg-${m.act}" data-id="${m.id}">${esc(m.label)}</button><button type="button" class="mh-sec" data-act="msg-done" data-id="${m.id}">Handled</button>`}
  else if(ns.kind==='s'){const g=ns.sg;hT=g.task;hS=ns.why;if(g.sid)hPpl=[g.sid];hActs=`<button type="button" class="mh-main" data-act="sg-add" data-id="${g.id}">${ic('plus',16,2.4)} Add</button><button type="button" class="mh-sec" data-act="sg-no" data-id="${g.id}">Not a promise</button>`}
  else{hT='All clear for today';hS='Nothing is owed. Take a look at tomorrow?';hActs=`<button type="button" class="mh-main" data-act="plan-tmr">${ic('cal',16)} Tomorrow</button>`}
  const ppl=hPpl.map(id=>student(id)).filter(Boolean);
  const hero=`<section class="mhero rise ${ns.kind==='clear'?'clear':''}" style="--i:0" data-tour="head" aria-labelledby="mh-t">
    <span class="mh-tag">${ns.kind==='clear'?ic('check',13,2.6)+' All clear':'Do this first'}</span>
    <h1 class="mh-t" id="mh-t">${esc(hT)}</h1><p class="mh-s">${esc(hS)}</p>
    <div class="mh-row">${ppl.length?`<div class="avs3">${ppl.map(x=>`<button type="button" data-act="student" data-id="${x.id}" aria-label="Open ${esc(x.name)}">${av(x.name)}</button>`).join('')}</div>`:''}<div class="mh-acts">${hActs}</div></div>
    ${RINGS}</section>`;
  // capsules
  const caps=Array.from({length:7},(_,i)=>{const off=i-todayDow,d=dayDate(off),dots=dayDots(off);return `<button type="button" class="cap7 ${off===sel?'on':''} ${off<0?'past':''}" data-act="day" data-off="${off}" aria-pressed="${off===sel}" aria-label="${d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}${dots?', '+dots+' things':''}"><i class="${dots?'has':''}"></i><span>${S.lang==='bn'?d.toLocaleDateString('bn-BD',{weekday:'short'}):WD_SHORT[i]}</span><b class="num">${S.lang==='bn'?bnN(d.getDate()):d.getDate()}</b></button>`}).join('');
  // your day masonry
  const ag=agenda(sel),nm=nowMin();
  const nonR=ag.filter(e=>e.k!=='research');
  let a=sel===0?(nonR.find(e=>nm>=e.s&&nm<e.e)||nonR.find(e=>e.s>nm)||null):nonR[0]||null;
  const r=ag.find(e=>e.k==='research');const blk=sel===0?C().blocks.find(b=>b.today):null;
  const dLbl=sel===0?'Today':dayDate(sel).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
  const yellow=a?(()=>{const live=sel===0&&nm>=a.s&&nm<a.e;const pp=(a.people||[]).map(id=>student(id)).filter(Boolean);
    return `<button type="button" class="mc mc-y rise" style="--i:2" data-act="dayview"><span class="mc-tag">${live?'Now':sel===0?'Up next':a.time==='Due'?'Due':'Planned'}</span><b class="mc-t">${esc(a.t)}</b>
      <span class="mc-l">${esc(dLbl)}</span>${a.s!=null?`<span class="mc-l num">${rng2(a.s,a.e)}</span>`:''}<span class="mc-l">${esc(a.sub)}</span>
      <span class="mc-foot">${pp.length?`<span class="avs3">${pp.slice(0,3).map(x=>av(x.name)).join('')}${pp.length>3?`<span class="more">+${pp.length-3}</span>`:''}</span><span class="mc-who"><small>Students</small>${pp.length} booked</span>`:(()=>{const more=ag.filter(e=>e!==a&&e.k!=='research'&&(sel!==0||e.s>nm)).length;return more?`<span class="mc-who"><small>${sel===0?'After that':'Also'}</small>${more} more</span>`:`<span class="mc-who"><small>${sel===0?'Last one':'That\'s all'}</small>${sel===0?'today':'for the day'}</span>`})()}</span></button>`})()
    :`<button type="button" class="mc mc-y rise" style="--i:2" data-act="dayview"><span class="mc-tag">${esc(dLbl)}</span><b class="mc-t">A clear day</b><span class="mc-l">Nothing scheduled or due.</span></button>`;
  const blue=r?`<button type="button" class="mc mc-b rise" style="--i:3" ${sel===0&&!(blk&&blk.done)?'data-act="focus"':'data-act="go" data-v="compass"'} data-tour="research"><span class="mc-tag">${blk&&blk.done?'Done':'Protected'}</span><b class="mc-t">Writing</b><span class="mc-l num">${esc(r.s!=null?rng2(r.s,r.e):r.sub)}</span><span class="mc-l">${sel===0&&!(blk&&blk.done)?'Tap to start focus':esc(C().papers[0].t.split(' ').slice(0,3).join(' '))+'…'}</span><span class="bowl" aria-hidden="true"><i></i><i></i></span></button>`
    :`<button type="button" class="mc mc-b rise" style="--i:3" data-act="book-block"><span class="mc-tag">No block</span><b class="mc-t">Writing</b><span class="mc-l">Book an hour for your papers</span><span class="bowl" aria-hidden="true"><i></i><i></i></span></button>`;
  const pink=`<div class="mc mc-p rise" style="--i:4" role="group" aria-label="Quick actions"><button type="button" data-act="palette" aria-label="Capture a promise">${ic('plus',20,2.4)}<small>Capture</small></button><button type="button" data-act="focus" aria-label="Start a focus block">${ic('focus',20)}<small>Focus</small></button><button type="button" data-act="digest" aria-label="Open the digest">${ic('inbox',20)}<small>Digest</small></button></div>`;
  const listHTML=list.length?`<section class="mlist rise" style="--i:5" aria-labelledby="ml-h"><div class="msec"><h2 id="ml-h">Then</h2><button type="button" class="mlink" data-act="go" data-v="people">All promises</button></div><div class="ow calm">${list.slice(0,S.owAll?20:3).map((it,i)=>ocCard(it,i+1)).join('')}</div>${list.length>3&&!S.owAll?`<button type="button" class="lnk ow-more" data-act="ow-all">Show ${list.length-3} more</button>`:''}</section>`:'';
  return `<div class="view mtoday">${hero}
    <div class="caps rise" style="--i:1" role="group" aria-label="This week">${caps}</div>
    <div class="msec"><h2>${L('Your day')}</h2><button type="button" class="mlink" data-act="dayview">Whole day</button></div>
    <div class="masonry">${yellow}${blue}${pink}</div>
    <div class="mstack">${aiC}</div>
    ${listHTML}
    ${glanceHTML}
  </div>`;
}

/* ---------- next best step ---------- */
function nextStep(){
  const lateP=openP().filter(p=>dfrom(p.due)<0).sort((a,b)=>a.due<b.due?-1:1)[0];
  if(lateP)return{kind:'p',p:lateP,why:`It's ${dueLabel(lateP.due)}${lateP.who&&lateP.who!=='For you'?` and ${lateP.who.split(' ')[0]} is waiting`:''}.`};
  const r=S.sched.find(e=>e.k==='research'),blk=C().blocks.find(b=>b.today),nm=nowMin();
  if(r&&!(blk&&blk.done)&&nm>=r.s-30&&nm<r.e)return{kind:'research',r,why:nm<r.s?`Your protected writing block starts at ${fmtMin(r.s)}.`:'Your protected writing block is happening now.'};
  const todayP=openP().filter(p=>dfrom(p.due)===0)[0];
  if(todayP)return{kind:'p',p:todayP,why:'Due today. A quick one to clear first.'};
  const m=needs().find(x=>x.act!=='promise')||needs()[0];
  if(m)return{kind:'m',m,why:'A message that needs a decision from you.'};
  const sg=sugs()[0];
  if(sg)return{kind:'s',sg,why:'Margin found this in your email. Keep it or let it go.'};
  return{kind:'clear'};
}

function timeline(){
  const nm=nowMin();let html='',placed=false;
  S.sched.forEach(e=>{
    if(!placed&&nm<e.s){html+=nowLine(nm);placed=true}
    const past=nm>=e.e,live=nm>=e.s&&nm<e.e;
    const blk=C().blocks.find(b=>b.today);
    let body=`<div class="ev-t">${esc(e.t)}${e.k==='research'?`<span class="prot">${ic('lock',11,2.4)} ${L('Protected')}</span>`:''}</div><div class="ev-s">${esc(e.sub)}</div>`;
    if(e.people)body+=`<div class="avs">${e.people.map(id=>{const s=student(id);return `<button type="button" data-act="student" data-id="${id}" aria-label="Open ${esc(s.name)}">${av(s.name)}</button>`}).join('')}</div>`;
    if(e.k==='research')body=`<div class="ev-in">${body}<div class="row-acts">${blk&&blk.done?`<span class="pill" style="background:var(--ok-soft);color:var(--ok)">${ic('check',13,2.6)} Done, ${blk.h} h logged</span>`:`<button type="button" class="btn sm accent" data-act="focus">${ic('focus',15)} ${L('Start focus now')}</button>`}</div></div>`;
    if(e.k==='digest')body=`<div class="ev-t">${esc(e.t)}</div><div class="ev-s">${digest().length} things that could wait. <button type="button" class="who" data-act="digest">Peek now</button></div>`;
    html+=`<div class="ev ${past?'past':''} ${live?'live':''} ${e.k==='research'?'research':''}" ${e.k==='research'?'data-tour="research"':''}><div class="ev-time num">${fmtMin(e.s).replace(' ','\u00a0')}</div><div class="ev-body">${body}</div></div>`;
    if(live&&!placed){html+=nowLine(nm);placed=true}
  });
  if(!placed)html+=nowLine(nm);
  return `<div class="tl">${html}</div>`;
}
function nowLine(m){return `<div class="nowline" aria-label="Now, ${fmtMin(m)}"><span class="num">${fmtMinShort(m)}</span><i></i></div>`}
