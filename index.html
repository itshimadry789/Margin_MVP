/* ---------- palette ---------- */
let pal={q:'',sel:0,who:null,opts:[]};
function parse(q){
  const out={task:q.trim(),who:null,due:null};let t=' '+q+' ';
  for(const s of S.students){const f=s.name.split(' ')[0];const re=new RegExp('\\b('+s.name+'|'+f+')(\'s)?\\b','i');if(re.test(t)){out.who=s;break}}
  const low=t.toLowerCase();let m;
  const days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  if(/\b(today|tonight)\b/.test(low))out.due=0;
  else if(/\btomorrow\b/.test(low))out.due=1;
  else if(/\bnext week\b/.test(low))out.due=7;
  else if((m=low.match(/\bin (\d+) days?\b/)))out.due=+m[1];
  else{for(let i=0;i<7;i++){if(new RegExp('\\b'+days[i]+'\\b').test(low)){let d=(i-t0().getDay()+7)%7;if(d===0)d=7;out.due=d;break}}}
  let task=q.replace(/\b(by|on|before|until)?\s*(today|tonight|tomorrow|next week|in \d+ days?|sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/ig,'').replace(/\s+/g,' ').trim().replace(/[,.]$/,'');
  out.task=task?task[0].toUpperCase()+task.slice(1):'';
  return out;
}
function palOpts(){
  const q=pal.q.trim().toLowerCase();const o=[];
  if(q)o.push({k:'capture',l:'Save as a promise',i:'plus',hint:'Enter'});
  const base=[{k:'qp',l:'Make a question paper',i:'letter'},{k:'plan',l:'Plan my week',i:'cal'},{k:'collab',l:'Find a collaborator',i:'people'},{k:'scout',l:'Scout literature'+(q?' on “'+pal.q.trim()+'”':''),i:'search',always:!!q},{k:'reply',l:'Draft a reply to a student',i:'send'},{k:'go',v:'today',l:'Go to Today',i:'today'},{k:'go',v:'teaching',l:'Go to Make',i:'pen'},{k:'go',v:'compass',l:'Go to Grow',i:'spark'},{k:'go',v:'people',l:'Go to People',i:'people'},{k:'focus',l:'Start a focus block',i:'focus'},{k:'digest',l:'Open the daily digest',i:'inbox'}];
  base.forEach(b=>{if(!q||b.always||b.l.toLowerCase().includes(q))o.push(b)});
  S.students.forEach(s=>{if(q&&s.name.toLowerCase().includes(q))o.push({k:'student',v:s.id,l:s.name,sub:s.course,av:s.name})});
  return o.slice(0,8);
}
function openPalette(pre){
  pal={q:pre||'',sel:0,opts:[]};
  modal(`<div class="pal-in">${ic('plus',22,2)}<label class="sr" for="palq">Capture a promise or jump anywhere</label><input id="palq" autocomplete="off" placeholder="Promise something, or jump anywhere…" value="${esc(pal.q)}"><kbd class="muted" style="font-size:12px">Esc</kbd></div><div id="palpre"></div><ul class="pal-list" id="pallist" role="listbox" aria-label="Actions"></ul><div class="pal-foot"><span><kbd>↵</kbd>select</span><span><kbd>↑↓</kbd>move</span><span>Try “Send Priya the solutions by Thursday”</span></div>`,'palette','Capture or search');
  const inp=$('#palq');inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);palDraw();
}
function palDraw(){
  pal.opts=palOpts();if(pal.sel>=pal.opts.length)pal.sel=0;
  const p=parse(pal.q);
  $('#palpre').innerHTML=pal.q.trim()?`<div class="pal-pre"><span class="chip">Promise <b>${esc(p.task||'…')}</b></span><span class="chip">To <b>${p.who?esc(p.who.name):'no one yet'}</b></span><span class="chip">Due <b>${p.due==null?'no date':dueLabel(plus(p.due))}</b></span>${p.who?`<span class="chip">${esc(p.who.course)}</span>`:''}</div>`:'';
  $('#pallist').innerHTML=pal.opts.map((o,i)=>`<li><button type="button" class="opt" role="option" aria-selected="${i===pal.sel}" data-act="palopt" data-i="${i}">${o.av?av(o.av):`<span class="opt-ic">${ic(o.i,16)}</span>`}<span>${esc(o.l)}${o.sub?` <span class="muted">${esc(o.sub)}</span>`:''}</span>${o.hint?`<span class="k">${o.hint}</span>`:''}</button></li>`).join('');
}
function palRun(i){
  const o=pal.opts[i];if(!o)return;
  if(o.k==='capture'){const p=parse(pal.q);if(!p.task)return;snap();S.promises.push({id:uid(),sid:p.who?p.who.id:null,who:p.who?p.who.name:'For you',task:p.task,course:p.who?p.who.course.split(',')[0]:'',due:plus(p.due==null?3:p.due),done:false});closeLayer();commit('Promise saved'+(p.who?' for '+p.who.name.split(' ')[0]:''));return}
  closeLayer();
  if(o.k==='qp'){S.qpCur=null;go('qp');return}
  if(o.k==='plan'){S.cpTab='plan';go('compass');setTimeout(runCopilot,50);return}
  if(o.k==='collab'){S.peopleTab='colleagues';go('people');S.fc=S.fc||{};delete S.fc.collab;ai('collab_match',{}).then(r=>{if(r.ok){S.fc.collab=r;save();render()}});return}
  if(o.k==='scout'){S.cpTab='scout';S.cpQ=S.cpQ||{};if(pal.q.trim())S.cpQ.scout=pal.q.trim();go('compass');setTimeout(runCopilot,50);return}
  if(o.k==='reply'){openReplyDrafter();return}
  if(o.k==='go')go(o.v);else if(o.k==='focus')startFocus();else if(o.k==='digest')openDigest();else if(o.k==='student')openStudent(o.v);
}

let ft=null;
function startFocus(){
  const e=S.sched.find(x=>x.k==='research');let sec=25*60;const held=needs().length+digest().length;
  const el=document.createElement('div');el.className='focus';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Focus mode');
  const draw=()=>{const m=Math.floor(sec/60),s=sec%60;el.querySelector('.timer').textContent=m+':'+String(s).padStart(2,'0')};
  el.innerHTML=`<div class="breathe"></div><div class="k">Focus, research writing</div><h2>${esc(C().papers[0].next)}</h2><div class="timer num" aria-live="off">25:00</div><p class="held">${held} messages and notices are held until you finish.</p><div class="acts"><button type="button" class="btn" data-f="pause">Pause</button><button type="button" class="btn accent" data-f="end">End and log the block</button><button type="button" class="btn" data-f="quit">Leave without logging</button></div>`;
  document.body.appendChild(el);let paused=false;
  ft=setInterval(()=>{if(!paused&&sec>0){sec--;draw()}},1000);
  el.addEventListener('click',ev=>{const b=ev.target.closest('[data-f]');if(!b)return;const f=b.dataset.f;
    if(f==='pause'){paused=!paused;b.textContent=paused?'Resume':'Pause';return}
    clearInterval(ft);el.remove();
    if(f==='end'){snap();const blk=C().blocks.find(x=>x.today);if(blk)blk.done=true;commit(`Nice work. ${blk?blk.h:1} h logged`,false,[`Compass: ${fmt(hoursDone())} of 4 research hours this week`,`${needs().length+digest().length} messages released to your inbox`])}});
  el.querySelector('[data-f="end"]').focus();
}

/* ---------- toasts / undo ---------- */
let undoState=null,toastT=null;
function snap(){undoState=JSON.stringify(S)}
function toast(msg,canUndo,trail){
  const box=$('#toasts');clearTimeout(toastT);
  const tr=trail&&trail.length?`<div class="trail">${trail.map(t=>`<span>${ic('arrow',13,2.2)}${esc(t)}</span>`).join('')}</div>`:'';
  box.innerHTML=`<div class="toast ${canUndo?'':'only'}"><div class="toast-m"><span>${esc(msg)}</span>${tr}</div>${canUndo?'<button type="button" data-act="undo">Undo</button>':''}</div>`;
  toastT=setTimeout(()=>{box.innerHTML='';undoState=null},trail&&trail.length?7000:5000);
}
function commit(msg,noUndo,trail){save();render();refreshLayer();if(msg)toast(msg,!noUndo&&!!undoState,trail)}

function qpCoverage(p,setK){
  const qs=p.sets[setK];const clos=p.clos;
  const by={};clos.forEach(c=>by[c]=0);qs.forEach(q=>{by[q.clo]=(by[q.clo]||0)+q.marks});
  const tot=qs.reduce((a,q)=>a+q.marks,0);
  const diff={easy:0,medium:0,hard:0};qs.forEach(q=>diff[q.difficulty]=(diff[q.difficulty]||0)+q.marks);
  const warn=[];
  const unc=clos.filter(c=>!by[c]);if(unc.length)warn.push(`${unc.join(', ')} ${unc.length>1?'are':'is'} not covered.`);
  ['easy','medium','hard'].forEach(k=>{const act=tot?Math.round(diff[k]/tot*100):0,tg=p.mix[k];if(Math.abs(act-tg)>=20)warn.push(`${k[0].toUpperCase()+k.slice(1)} is ${act}% of marks; you asked for about ${tg}%.`)});
  if(tot!==p.total)warn.push(`Set ${setK} totals ${tot} marks; the paper says ${p.total}.`);
  const max=Math.max(1,...Object.values(by));
  return `<section class="card rise" style="--i:2"><div class="card-h"><h2>Coverage, set ${setK}</h2><span class="badge num">${tot} marks</span></div>
    ${clos.map(c=>`<div class="cov"><span>${c}</span><div class="meter ${by[c]?'':'warn'}"><i style="width:${by[c]/max*100}%"></i></div><b class="num">${by[c]}</b></div>`).join('')}
    <div class="cov-d">${['easy','medium','hard'].map(k=>`<span class="tag">${k} ${tot?Math.round(diff[k]/tot*100):0}%</span>`).join('')}</div>
    ${warn.length?`<ul class="qp-warn">${warn.map(w=>`<li>${ic('alert',13,2.2)} ${esc(w)}</li>`).join('')}</ul>`:`<p class="qp-ok">${ic('check',14,2.6)} Every CLO is covered and the difficulty mix matches.</p>`}</section>`;
}

  const own=H.drafts.filter(x=>!x.done&&!D['hd-'+x.id]).map(x=>({c:{key:'hd-'+x.id,icon:x.icon,color:x.kind==='chair'?'var(--p-pink)':'var(--p-yellow)',source:`Draft · ${x.kind==='notice'?'notice summary':x.kind==='chair'?'for the chair':'reply to '+x.who}`,title:x.title,
    body:`<div class="sc-draft">${esc(x.text)}</div>`,why:x.why,badge:'',
    actions:[{label:x.kind==='chair'?'Send for sign-off':'Approve',act:'hd-approve',attrs:`data-id="${x.id}"`,primary:true,icon:'check'},{label:'Edit',act:'hd-edit',attrs:`data-id="${x.id}"`}],dismiss:{act:'hd-dismiss',attrs:`data-id="${x.id}"`},privacy:'Nothing is sent without you'}}));
  const base=v9readyCards().filter(c=>c.actions&&c.actions.length);   // half-done drafts ("Drafting…") stay out

};

/* ---------- 4. "Margin is learning your style" ---------- */
function h10Learn(kind,before,after){
  const b=(before||'').trim(),a=(after||'').trim();if(!a||a===b)return;
  let p=null;
  if(kind==='q'){
    if(/show (your |all )?(working|steps)|each step/i.test(a)&&!/show (your |all )?(working|steps)|each step/i.test(b))p={k:'q-steps',text:'You ask students to show their working.'};
    else if(a.length<b.length*.8)p={k:'q-short',text:'You prefer short, direct question wording.'};
    else p={k:'q-own',text:'You like questions set in a real context; Margin will add one.'};
  }else if(kind==='reply'){
    if(/^(hi|hello)\b/i.test(a)&&/^dear\b/i.test(b))p={k:'reply-hi',text:'You open replies with "Hi", not "Dear".'};
    else if(a.length<b.length*.8)p={k:'reply-short',text:'You keep replies to students short and direct.'};
    else p={k:'reply-warm',text:'You add a line of encouragement to replies.'};
  }else if(kind==='cf'){
    if(/week\s*\d+/i.test(a)&&!/week\s*\d+/i.test(b))p={k:'cf-week',text:'You name the exact week for each change in improvement plans.'};
    else if(a.length<b.length*.8)p={k:'cf-short',text:'You keep improvement plans to two short sentences.'};
    else p={k:'cf-detail',text:'You like improvement plans with one concrete classroom change.'};
  }else{
    p=a.length<b.length*.8?{k:'notice-short',text:'You want notice summaries in one line.'}:{k:'notice-dates',text:'You want the key dates first in notice summaries.'};
  }
  const H=h10();const ex=H.prefs.find(x=>x.k===p.k);
  if(ex)ex.text=p.text;else H.prefs.push({id:uid(),k:p.k,text:p.text,from:'Learned '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long'})});
  save();h10Chip(`Got it. ${p.text}`,true);
}

  const el=document.createElement('div');el.className='h10-chip';el.setAttribute('role','status');

}

const norm=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function h10BankAll(){const mine=DEPTV?DEPTV.bank.filter(q=>q.mine):[];return [...mine,...h10().bank]}
function h10AddPaper(p){
  const all=h10BankAll();const seen=new Set(all.map(q=>norm(q.text)));let add=0,dup=0;
  [...p.sets.A,...p.sets.B].forEach(q=>{const k=norm(q.text);if(!k)return;if(seen.has(k)){dup++;return}seen.add(k);add++;
    h10().bank.unshift({id:uid(),course:p.course,clo:q.clo,bloom:q.bloom,difficulty:q.difficulty||'medium',marks:q.marks,text:q.text,source:`From ${p.course} ${p.title}`,shared:false,usedBy:[],added:ymd(t0())})});
  save();return {add,dup,total:h10BankAll().length};
}

const H10_CARD_ACTS=new Set(['sg-add','sg-no','copy-draft','cqi-approve','card-dismiss','collab-chat','plan-approve','hd-approve','hd-dismiss','msg-cal','msg-done','done-p','snz']);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  // an approval card opened from "Ready for you" closes once it is handled
  if(H10_CARD_ACTS.has(a)&&b.closest('#layer .h10-sheet'))setTimeout(()=>{if(layerKey==='h10card')closeLayer()},0);

  if((b.classList.contains('mh-main')||b.classList.contains('h9-main'))&&/^(done-p|sg-add|hd-approve|cqi-approve|copy-draft|msg-)/.test(a)){const card=b.closest('.mhero,.h9');if(card)card.classList.add('h10-ok')}
  // record approved items for the Friday note (the existing handlers still run)
  if(a==='copy-draft')h10log('reply','Reply to Arif approved');
  if(a==='cqi-approve')h10log('cf','Improvement plan filed');
  if(a==='msg-cal')h10log('notice','Notice added to your term');
  if(a==='blk'){const bl=C().blocks.find(x=>x.id===id);if(bl&&!bl.done)h10log('research','Writing block, '+bl.h+' h')}
  if(a==='de-save'){const k=b.dataset.k;const r=S.fc&&S.fc[k];const before=r?(k==='reply'?r.output.reply:r.output.text):'';const after=($('#de-t')||{}).value;h10log(k==='reply'?'reply':'cf',k==='reply'?'Reply approved':'Improvement plan filed');setTimeout(()=>h10Learn(k==='reply'?'reply':'cf',before,after),400)}
  if(a==='qq-save'){const p=S.qps&&S.qps[S.qpCur];const q=p&&p.sets[S.qpSet||'A'].find(x=>x.id===id);const after=($('#qta-'+id)||{}).value;if(q){const before=q.text;setTimeout(()=>h10Learn('q',before,after),400)}}
  if(a==='qp-approve'){const p=S.qps&&S.qps[S.qpCur];if(p){h10log('qp',`${p.course} ${p.title} approved`);setTimeout(()=>{const r=h10AddPaper(p);h10Chip(`${r.add} question${r.add===1?'':'s'} added to your bank${r.dup?`, ${r.dup} duplicate${r.dup>1?'s':''} skipped`:''}. ${r.total} in total.`)},450)}}
  if(a==='goal-pick')setTimeout(()=>{const nh=h10NextHour();snap();C().blocks.push({id:uid(),d:nh.wd,l:'7:30 to 8:30 am, before class',h:1,done:false});save();render();toast(`Next research hour: ${nh.label}, 7:30 am`,true,['Added to this week\'s writing blocks','Margin moves it if the week gets heavy'])},60);

  const own={'h10-open':1,'h10-brief':1,'h10-weeknote':1,'h10-friday':1,'hd-approve':1,'hd-edit':1,'hd-save':1,'hd-dismiss':1,'h10-knows':1,'h10-pref-save':1,'h10-pref-del':1,'h10-chipx':1,'h10-chair':1,'h10-bank':1,'bank-open':1};
  if(!own[a])return;e.stopPropagation();const H=h10();
  if(a==='h10-open'){if(layerKey)closeLayer();h10OpenCard(b.dataset.k)}
  else if(a==='h10-brief'){H.noteX.brief=true;save();render();h10BriefSheet()}
  else if(a==='h10-weeknote'){H.noteX.week=true;save();render();sheet(`<div class="sheet-h"><div><div class="tile-k">Friday note</div><h2 id="sh-t">Your week</h2></div><button type="button" class="icon-btn" data-act="close" aria-label="Close">${ic('x',20)}</button></div>${h10WeekHTML()}`,'h10week')}
  else if(a==='h10-friday'){H.friday=!H.friday;if(H.noteX){H.noteX.week=false;H.noteX.brief=false}save();render();drawProto()}
  else if(a==='hd-approve'){const d=H.drafts.find(x=>x.id===id);if(!d)return;leave('hd-'+id,()=>{snap();d.done=true;if(d.est)h10log(d.est,d.title);if(d.kind==='reply')copyText(d.text);commit(d.kind==='chair'?'Sent to Prof. Nasreen Akhter for sign-off (demo)':d.kind==='reply'?'Approved and copied. Paste it into your email; nothing was sent.':'Approved. Saved to your notes.',false,d.est?[`About ${HABIT_ESTIMATES[d.est].min} min saved (estimate)`]:null);if(layerKey==='h10card')closeLayer()})}
  else if(a==='hd-dismiss'){snap();S.dismissed=S.dismissed||{};S.dismissed['hd-'+id]=true;if(layerKey)closeLayer();commit("Dismissed. Margin won't suggest it again.")}
  else if(a==='hd-edit'){const d=H.drafts.find(x=>x.id===id);sheet(`<div class="sheet-h"><div><div class="tile-k">${ic('lock',12,2.4)} Draft · private to you</div><h2 id="sh-t">${esc(d.title)}</h2></div><button type="button" class="icon-btn" data-act="close" aria-label="Close">${ic('x',20)}</button></div><div class="field"><label for="hd-t">Edit before you approve</label><textarea id="hd-t" rows="8">${esc(d.text)}</textarea></div><div class="row-acts" style="margin-top:12px"><button type="button" class="btn primary" data-act="hd-save" data-id="${d.id}">Approve</button></div>`,'hdedit')}
  else if(a==='hd-save'){const d=H.drafts.find(x=>x.id===id);const before=d.text;const after=$('#hd-t').value.trim()||d.text;d.text=after;closeLayer();snap();d.done=true;if(d.est)h10log(d.est,d.title);if(d.kind==='reply')copyText(after);commit('Approved with your edits.');setTimeout(()=>h10Learn(d.kind==='reply'?'reply':'notice',before,after),400)}
  else if(a==='h10-knows')openKnows();
  else if(a==='h10-pref-save'){const p=H.prefs.find(x=>x.id===id);const v=$('#kp-'+id).value.trim();if(p&&v){p.text=v;save();toast('Preference updated')}}

async function readEval(file){
  const D=g11();toast('Reading the course evaluation…');
  let input;
  if(/\.pdf$/i.test(file.name)){const buf=new Uint8Array(await file.arrayBuffer());if(buf.length>2.3e6){toast('That PDF is over 2 MB. Try the Excel export instead.');return}let bin='';for(let i=0;i<buf.length;i+=32768)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+32768));input={pdf:btoa(bin)}}
  else{const rows=await readSheet(file);const head=rows[0]||[];const body=rows.slice(1);
    const isSeq=v=>v.length>2&&v.every((x,k)=>k===0||x===v[k-1]+1);
    const nums=head.map((h,i)=>({h,v:body.map(r=>Number(r[i])).filter(x=>x>=1&&x<=5)})).filter(c=>c.v.length>=body.length*.6&&c.v.length&&!/^(item|no\.?|#|id|serial|sl|s\.?\s*no|response|respondent)\b/i.test(c.h)&&!isSeq(c.v));
    const avg=nums.length?nums.reduce((a,c)=>a+c.v.reduce((x,y)=>x+y,0)/c.v.length,0)/nums.length:null;
    const best=nums.slice().sort((a,b)=>b.v.reduce((x,y)=>x+y,0)/b.v.length-a.v.reduce((x,y)=>x+y,0)/a.v.length);
    const summary={rating:avg?`${avg.toFixed(1)} out of 5 across ${body.length} responses`:`${body.length} responses`,highlight:best[0]?`Highest-rated item: “${best[0].h}”.`:'',concern:best.length>1?`Lowest-rated item: “${best[best.length-1].h}”.`:''};
    input={text:[head.join(' | '),...body.slice(0,200).map(r=>r.join(' | '))].join('\n'),summary}}
  const res=API&&AIMETA?await ai('summarise_eval',input):null;
  const out=res&&res.ok?res.output:(input.summary||{rating:'4.3 out of 5 (sample: PDF reading needs the live AI)',highlight:'Students valued the worked examples and quick feedback on quizzes.',concern:'Several asked for more practice on capital budgeting before the final.'});
  D.report.eval={output:out,source:res&&res.ok?res.source:'offline',file:file.name};save();render();toast('Course evaluation added to the report data');
}

      ai('draft_qp_one',{course:p.course,clo:q.clo,bloom:q.bloom,marks:q.marks,section:q.section,language:p.language,avoid}).then(r=>{S.qpBusyQ=null;if(r.ok&&r.output.text&&!avoid.includes(r.output.text)){snap();Object.assign(q,{text:r.output.text,bloom:r.output.bloom,difficulty:r.output.difficulty,answer:r.output.answer,rubric:r.output.rubric,source:r.output.source||(r.source==='live'?'Regenerated by Margin':'From your question bank')});commit('New question in place',false,[`Same CLO (${q.clo}) and ${q.marks} marks`])}else{render();toast(r.ok?'No other bank question fits this CLO; live AI can write a new one':'Could not regenerate right now')}});break}
    case 'qp-send':{const p=S.qps[S.qpCur];p.moderator=$('#qp-mod').value;p.status='moderation';save();render();toast(`Sent to ${colName(p.moderator)}`,false,['Only you and your moderator can see the paper']);

    case 'mc-accept':case 'mc-dismiss':{const p=S.qps[S.qpCur];const c=p.comments.find(x=>x.qid===id);snap();if(a==='mc-accept'){const q=p.sets.A.find(x=>x.id===id);if(q){if(c.newText)q.text=c.newText;if(c.newMarks)q.marks=c.newMarks;q.source='Changed after moderation'}}c.resolved=true;commit(a==='mc-accept'?'Change accepted':'Kept your version');break}

      if(cf){const it=cf.items.find(i=>/Moderated question paper/i.test(i.t));if(it){it.st='done';it.s=`${p.title}, moderated by ${colName(p.moderator||'t1')}, filed by Margin`}if(!cf.items.some(i=>i.t==='Question paper CLO mapping'))cf.items.splice(4,0,{t:'Question paper CLO mapping',s:`${p.sets.A.length} questions mapped to ${new Set(p.sets.A.map(q=>q.clo)).size} CLOs`,st:'done'})}
      commit('Approved, locked and filed',false,[cf?`${p.course} course file: moderated paper and CLO mapping added (${Math.round(cfPct(cf)*100)}%)`:'Saved','Your chair sees only that a moderated paper was filed']);break}

const GOALS=[
  {kind:'custom',t:'Apply for a PhD abroad',d:'Tests, statements, letters and deadlines on one timeline.',ms:['Shortlist 8 programmes','Take the IELTS','Draft statement of purpose','Ask for 3 recommendation letters','Submit first application']},

function openGoals(){sheet(`<div class="sheet-h"><div><div class="tile-k">New goal</div><h2 id="sh-t">What do you want to make happen?</h2></div><button type="button" class="icon-btn" data-act="close" aria-label="Close">${ic('x',20)}</button></div><p class="row-s">Pick one. Margin breaks it into small steps and fits them around your term.</p><div class="tpl">${GOALS.map(g=>`<button type="button" data-act="goal-pick" data-v="${esc(g.t)}"><b>${esc(g.t)}</b><span>${esc(g.d)}</span></button>`).join('')}</div>`,'goals')}
function openReview(){
  const moved=C().papers.filter(p=>p.stage>=1&&p.stage<5).slice(0,3);
  sheet(`<div class="sheet-h"><div><div class="tile-k">Friday review</div><h2 id="sh-t">Ten minutes, three questions</h2></div><button type="button" class="icon-btn" data-act="close" aria-label="Close">${ic('x',20)}</button></div>
  <h3>What moved</h3><ul class="list">${moved.map(p=>`<li class="row"><span class="row-ic">${ic('check',15)}</span><div class="row-main"><div class="row-t">${esc(p.t)}</div><div class="row-s">${C().stages[p.stage]}</div></div></li>`).join('')}<li class="row"><span class="row-ic">${ic('clock',15)}</span><div class="row-main"><div class="row-t">${fmt(hoursDone())} research hours</div><div class="row-s">of 4 planned this week</div></div></li></ul>
  <div class="field"><label for="rv-stuck">What got stuck?</label><textarea id="rv-stuck" rows="2" placeholder="e.g. Midterm grading ate Wednesday's block"></textarea></div>

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(S.role==='teacher'&&S.onboarded&&!tour)openPalette();return}
  if(e.key==='Escape'){if(document.querySelector('.focus')||document.querySelector('.cover'))return;if(tour){endTour(false);return}if(protoOpen){protoOpen=false;drawProto();return}if(layerKey&&layerKey!=='onboarding'){closeLayer();return}}
  if(layerKey==='palette'){
    if(e.key==='ArrowDown'){e.preventDefault();pal.sel=(pal.sel+1)%pal.opts.length;palDraw()}
    else if(e.key==='ArrowUp'){e.preventDefault();pal.sel=(pal.sel-1+pal.opts.length)%pal.opts.length;palDraw()}
    else if(e.key==='Enter'&&e.target.id==='palq'){e.preventDefault();palRun(pal.sel)}
  }
  if(layerKey&&e.key==='Tab'){const box=$('#layer [role="dialog"]');if(!box)return;const f=[...box.querySelectorAll('button:not([disabled]),input,textarea,select,summary')];if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}

/* ====================== v12: growth message, the Outcome Loop in the tour, AI decision signal ======================
   1. The guided tour now walks the Outcome Loop: Class Insight on a BBA course, then the trimester teaching report.
   2. Every decision on an approval card (approve, edit, dismiss) is counted. These counts are the training signal
      for Margin's own models later. Only counts and card types are kept, never what the teacher wrote. */

/* ---------- 1. tour: the Outcome Loop ---------- */
if(GROWTH_FEATURES_ENABLED){
  const at=TOUR.findIndex(x=>x.sel==='[data-tour="cf1"]');
  if(at>=0)TOUR.splice(at+1,0,
    {view:'teaching',sel:'#layer .g11-ins',open:()=>{S.g11tab='insight';openCourse('cf-fin')},k:'The Outcome Loop',t:'He sees what his students actually learned',
     b:'His Principles of Finance quiz and midterm marks became CLO results in seconds. CLO3, evaluating projects with NPV and IRR, is below target. Margin names the hardest question and suggests a practice quiz and a revision class he can approve.'},
    {view:'compass',sel:'#g11-rep',k:'Grow every trimester',t:'The trimester ends with a teaching report, not a scramble',
     b:'Margin drafts what went well, where students struggled and three actions for next trimester. He edits and approves; the actions become next trimester\'s goals. It stays private unless he shares it.',
     try:{l:'Draft my teaching report',run:()=>{const g=$('[data-act="g11-gen"]');g&&g.click()}}});
}
const v11tourGo=tourGo;
tourGo=function(i){
  v11tourGo(i);
  const st=TOUR[i];if(!st||!st.open)return;
  st.open();
  setTimeout(()=>{const el=$(st.sel);if(el)el.scrollIntoView({block:'start',behavior:'smooth'});setTimeout(placeSpot,380)},120);
};

/* ---------- 2. AI decision signal ---------- */
const SIG_KEY='margin.signal';
var SIG_PILOT={approved:39,edited:13,dismissed:18}; // illustrative pilot totals this term, all teachers, shown on the IQAC view
function sigLoad(){try{return JSON.parse(localStorage.getItem(SIG_KEY))||{approved:0,edited:0,dismissed:0,log:[]}}catch(_){return {approved:0,edited:0,dismissed:0,log:[]}}}
var SIG=sigLoad();
function sigTotals(){const x=SIG||{approved:0,edited:0,dismissed:0};const a=SIG_PILOT.approved+x.approved,e=SIG_PILOT.edited+x.edited,d=SIG_PILOT.dismissed+x.dismissed;return {a,e,d,t:a+e+d}}
function sigSave(){try{localStorage.setItem(SIG_KEY,JSON.stringify(SIG))}catch(_){}}
document.addEventListener('click',e=>{
  const b=e.target.closest('.scard .sc-acts button');if(!b)return;
  const card=b.closest('.scard');const label=(b.textContent||'').trim();
  const kind=b.classList.contains('ghost')?'dismissed':/^edit\b/i.test(label)?'edited':b.classList.contains('primary')?'approved':null;
  if(!kind)return;
  const src=(card.querySelector('.sc-sl')||{}).textContent||'';
  SIG[kind]++;SIG.log.push({k:kind,type:src.split('·')[0].trim().slice(0,40),at:Date.now()});if(SIG.log.length>200)SIG.log.shift();sigSave();
},true);
function sigRow(n,label,total,cls){const pct=total?Math.round(n/total*100):0;return `<div class="sig-row"><span>${label}</span><span class="sig-bar" aria-hidden="true"><i class="${cls}" style="width:${pct}%"></i></span><b class="num">${pct}%</b></div>`}
function sigCard(){
  const Q=sigTotals(),A=Q.a,E=Q.e,D=Q.d,T=Q.t;
  return `<section class="card rise sig-card" style="--i:2;margin-top:20px" id="sig-card"><div class="card-h"><h2>AI quality, from teachers' decisions</h2><span class="card-sub" style="margin:0">${T} decisions this term</span></div>
  <p class="card-sub">Every AI draft is approved, edited or dismissed by a teacher. Margin counts those decisions; it never keeps what teachers wrote. The counts tell us where the AI is good enough, and become training data for Margin's own models.</p>
  ${sigRow(A,'Approved as drafted',T,'ok')}${sigRow(E,'Edited, then approved',T,'mid')}${sigRow(D,'Dismissed',T,'low')}
  <p class="row-s" style="margin-top:10px">Pilot target: 70% approved with light or no edits. ${Math.round((A+E)/T*100)}% so far.${SIG.approved+SIG.edited+SIG.dismissed?` Includes ${SIG.approved+SIG.edited+SIG.dismissed} from this demo.`:''}</p></section>`;
}
const v11render=render;
render=function(){
  const r=v11render.apply(this,arguments);
  if(S.view==='admin'&&!$('#sig-card')){const sc=$('[data-tour="score"]');if(sc)sc.insertAdjacentHTML('afterend',sigCard())}
  return r;
};
const v11drawProto=drawProto;
drawProto=function(){
  v11drawProto();
  if(FRAME||!protoOpen)return;const m=$('#proto .proto-m');if(!m)return;
  m.insertAdjacentHTML('beforeend',`<h4>AI decisions in this demo</h4><p class="row-s" style="margin:0">${SIG.approved} approved · ${SIG.edited} edited · ${SIG.dismissed} dismissed. Shown to IQAC as AI quality.</p>`);
};

routeFromHash();
render();
boot8();
if(!FRAME){if(!S.covered)showCover();else if(!S.onboarded)onboarding()}
})();
